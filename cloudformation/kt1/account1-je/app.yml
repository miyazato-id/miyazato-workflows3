AWSTemplateFormatVersion: '2010-09-09'
Description: Internal NLB Stack

Resources:

  NetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: vesta-internal-nlb
      Type: network
      Scheme: internal
      Subnets:
        - !ImportValue subnet1a-id
        - !ImportValue subnet1c-id
        - !ImportValue subnet1d-id

  NlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vesta-tg
      TargetType: ip
      Protocol: TCP
      Port: 80
      VpcId: !ImportValue vpc1-id
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port

  NlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NetworkLoadBalancer
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup
          
# AWSTemplateFormatVersion: '2010-09-09'
# Description: API Gateway + VPC Link + Cognito Authorizer

# Resources:

  ApiGatewayVpcLink:
    Type: AWS::ApiGateway::VpcLink
    Properties:
      Name: my-vpc-link
      TargetArns:
        - !ImportValue vesta-nlb-arn

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: MyRestApi

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: VestaCognitoAuthorizer
      RestApiId: !Ref RestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !ImportValue Vesta-UserPoolArn

  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: '{proxy+}'

  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResource
      HttpMethod: ANY

      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer

      RequestParameters:
        method.request.path.proxy: true

      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY

        Uri:
          Fn::Sub:
            - 'http://${NlbDnsName}/{proxy}'
            - NlbDnsName:
                Fn::ImportValue: vesta-nlb-dns

        ConnectionType: VPC_LINK
        ConnectionId: !Ref ApiGatewayVpcLink

        RequestParameters:
          integration.request.path.proxy: 'method.request.path.proxy'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethod
      - CognitoAuthorizer
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  
Outputs:

  NlbArn:
    Description: Network Load Balancer ARN
    Value: !Ref NetworkLoadBalancer
    Export:
      Name: vesta-nlb-arn

  NlbDns:
    Description: Network Load Balancer DNS Name
    Value: !GetAtt NetworkLoadBalancer.DNSName
    Export:
      Name: vesta-nlb-dns

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref NlbTargetGroup
    Export:
      Name: vesta-tg-arn
  ApiId:
    Description: API Gateway ID
    Value: !Ref RestApi
    Export:
      Name: Vesta-RestApiId

  ApiUrl:
    Description: API Gateway URL
    Value:
      Fn::Sub: 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  CognitoAuthorizerId:
    Description: Cognito Authorizer ID
    Value: !Ref CognitoAuthorizer
