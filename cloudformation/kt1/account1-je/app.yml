AWSTemplateFormatVersion: '2010-09-09'
Description: Internal NLB + API Gateway + VPC Link

Resources:
   #####################################
  # API Gateway Access Logs
  #####################################

  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/accesslogs
      RetentionInDays: 90

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn


  #####################################
  # S3 Bucket
  #####################################
  NlbAccessLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-nlb-accesslog"

  #####################################
  # S3 Bucket Policy
  #####################################
  NlbAccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NlbAccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
            Resource: !GetAtt NlbAccessLogBucket.Arn

          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub "${NlbAccessLogBucket.Arn}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  #####################################
  # Network Load Balancer
  #####################################
  NetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
      - NlbAccessLogBucketPolicy
    Properties:
      Name: vesta-internal-nlb
      Type: network
      Scheme: internal

      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: "true"

        - Key: access_logs.s3.bucket
          Value: !Ref NlbAccessLogBucket

        - Key: access_logs.s3.prefix
          Value: nlb

      Subnets:
        - !ImportValue subnet1a-id
        - !ImportValue subnet1c-id
        - !ImportValue subnet1d-id

  NlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vesta-tg
      TargetType: ip
      Protocol: TCP
      Port: 80
      VpcId: !ImportValue vpc1-id
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port

  NlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NetworkLoadBalancer
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup

  #####################################
  # API Gateway VPC Link
  #####################################
  ApiGatewayVpcLink:
    Type: AWS::ApiGateway::VpcLink
    Properties:
      Name: my-vpc-link
      TargetArns:
        - !Ref NetworkLoadBalancer

  #####################################
  # REST API
  #####################################
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: MyRestApi

  #####################################
  # Proxy Resource
  #####################################
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: '{proxy+}'

  #####################################
  # Proxy Method
  #####################################
  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResource
      HttpMethod: ANY

      AuthorizationType: NONE

      RequestParameters:
        method.request.path.proxy: true

      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET

        Uri:
          Fn::Sub:
            - 'http://${NlbDnsName}/{proxy}'
            - NlbDnsName: !GetAtt NetworkLoadBalancer.DNSName

        ConnectionType: VPC_LINK
        ConnectionId: !Ref ApiGatewayVpcLink

        RequestParameters:
          integration.request.path.proxy: 'method.request.path.proxy'

  #####################################
  # Deployment
  #####################################
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethod
    Properties:
      RestApiId: !Ref RestApi

  #####################################
  # Stage
  #####################################
  ApiStage:
    Type: AWS::ApiGateway::Stage

    DependsOn:
      - ApiGatewayAccount
      - ApiGatewayAccessLogGroup

    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn

        Format: >
          {
            "requestId":"$context.requestId",
            "ip":"$context.identity.sourceIp",
            "httpMethod":"$context.httpMethod",
            "resourcePath":"$context.resourcePath",
            "status":"$context.status"
          }

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true

 #####################################
  # ECS cluster, task definition, and service
  #####################################
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: vesta-ecs-cluster

  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vesta-taskdef

      RequiresCompatibilities:
        - FARGATE

      NetworkMode: awsvpc

      Cpu: '256'
      Memory: '512'

      ExecutionRoleArn: arn:aws:iam::473427586283:role/ecsTaskExecutionRole

      ContainerDefinitions:
        - Name: app
          Image: 473427586283.dkr.ecr.ap-northeast-1.amazonaws.com/my-nginx:latest
          Essential: true

          PortMappings:
            - ContainerPort: 80
              Protocol: tcp

  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Service Security Group

      VpcId: !ImportValue vpc1-id

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/16

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  EcsService:
    DependsOn:
      - EcsTaskDefinition
      - NlbListener
    Type: AWS::ECS::Service

    Properties:
      ServiceName: vesta-service

      Cluster: !Ref EcsCluster

      TaskDefinition: !Ref EcsTaskDefinition

      LaunchType: FARGATE

      DesiredCount: 1

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED

          Subnets:
            - !ImportValue subnet2a-id
            - !ImportValue subnet2c-id
            - !ImportValue subnet2d-id

          SecurityGroups:
            - !Ref EcsServiceSecurityGroup

      LoadBalancers:
        - TargetGroupArn: !Ref NlbTargetGroup
          ContainerName: app
          ContainerPort: 80

Outputs:

  NlbArn:
    Description: Network Load Balancer ARN
    Value: !Ref NetworkLoadBalancer
    Export:
      Name: vesta-nlb-arn

  NlbDns:
    Description: Network Load Balancer DNS Name
    Value: !GetAtt NetworkLoadBalancer.DNSName
    Export:
      Name: vesta-nlb-dns

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref NlbTargetGroup
    Export:
      Name: vesta-tg-arn

  ApiId:
    Description: API Gateway ID
    Value: !Ref RestApi
    Export:
      Name: Vesta-RestApiId

  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  clusterName:
    Value: !Ref EcsCluster
    Export:
      Name: vesta-ecs-cluster

  ServiceName:
    Value: !GetAtt EcsService.Name
    Export:
      Name: vesta-ecs-service